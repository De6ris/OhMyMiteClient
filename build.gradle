plugins {
    id 'fml-loom' version '0.1'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
//    archivesName = project.archives_base_name
    archivesName = "[MITE生电]ommc"
}

repositories {
    mavenLocal()
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    maven {
        name = "ModdedMITE"
        url = uri("https://maven.limingzxc.top/repository/maven-public/")
    }
}

configurations {
    fml
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    fml "com.github.MinecraftIsTooEasy:FishModLoader:${project.loader_version}"
    implementation "com.github.MinecraftIsTooEasy:FishModLoader:${project.loader_version}"

    // depends
    implementation "org.moddedmite:rusted-iron-core:1.5.7"
    implementation "com.github.MinecraftIsTooEasy:ManyLib:2.3.1"

    // compile
    compileOnly "com.github.MinecraftIsTooEasy:ModMenu:10.1.1"
    compileOnly "com.github.MinecraftIsTooEasy:EMI:1.1.27"

    // testing
    localRuntime "com.github.MinecraftIsTooEasy:Gson:2.10.1"
    localRuntime "com.github.MinecraftIsTooEasy:FastUtil:8.5.12"
    localRuntime "com.github.MinecraftIsTooEasy:EMI:1.1.27"
    localRuntime "org.moddedmite:modern-mite:3.7.7"
}

loom {
    accessWidenerPath = file("src/main/resources/ommc.accesswidener")
    mergedMinecraftJar()
    mods {
        "${archives_base_name}" {
            sourceSet sourceSets.main
        }
    }
}

def fmlResolvedFile = configurations.fml.files.iterator().next()
loom.setFML(fmlResolvedFile)
dependencies.add("mappings", loom.fmlMCPMappings())

processResources {
    inputs.property "version", project.version

    filesMatching("fml.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}"}
    }
}

tasks.named('runClient', JavaExec).configure { exec ->
    exec.setArgs(['--username', project.property('username'), '--session', '0', '--width', '854', '--height', '480'])
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "ommc"
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.

        // Default Maven Central.
        maven {
            name = "ModdedMITE"
            url = uri("https://maven.limingzxc.top/repository/maven-releases/")
            credentials {
                // Read only from gradle.properties (user level, your gradle_home)
                username = project.findProperty("nexusUsername")
                password = project.findProperty("nexusPassword")
            }
        }
    }
}
